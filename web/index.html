<!DOCTYPE html>
<html lang="es-VE">

<head>
  <meta charset="utf-8" />
  <meta httpequiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover, maximum-scale=1, user-scalable=no" />

  <!-- Monetag Verification -->
  <meta name="monetag" content="d0f0832e823701d86e82b861314eb1dd">

  <!-- PWA Configuration -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Standard Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icon.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icon.png" />

  <!-- Apple Touch Icons (Safari/iOS) -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Apple Web App Configuration -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kuanto" />

  <!-- Additional PWA Meta Tags -->
  <meta name="theme-color" content="#1c1c1e" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- The title and other meta tags are auto-generated by Expo -->
  <style>
    /* Estilos críticos para PWA y iOS */
    :root {
      /* Force dark color scheme and brand accent color */
      color-scheme: dark;
      accent-color: #02DF82 !important;
      --brand-green: #02DF82;
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      height: 100dvh;
      width: 100%;
      background-color: #1c1c1e;
      overscroll-behavior: none;
      /* Global accent color */
      accent-color: var(--brand-green) !important;
    }

    body {
      height: 100%;
      width: 100%;
      background-color: #1c1c1e;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      overflow: hidden;
      accent-color: var(--brand-green) !important;
    }

    /* Force accent color on all form elements */
    input, select, textarea, button {
      accent-color: var(--brand-green) !important;
    }

    /* Target the date picker specifically for Safari */
    input[type="date"] {
      color-scheme: dark;
      accent-color: var(--brand-green) !important;
    }

    #root {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      background-color: #1c1c1e;
    }

    /* Pre-rendered Native-like Splash Screen for Web while JS downloads */
    #splash-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #1c1c1e;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      transition: opacity 0.5s ease-out;
    }

    #splash-loader img {
      width: calc(100% * 0.7); /* Scale roughly to match app.json 100% resizeMode contain width constraint */
      max-width: 300px;        /* Limits size on Desktop */
      height: auto;
    }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  
  <div id="splash-loader">
    <!-- Using the icon as defined in app.json configuration -->
    <img src="/apple-touch-icon.png" alt="Cargando Kuanto" />
  </div>

  <div id="root"></div>

  <script>
    // Expo / React Native Web will mount inside #root.
    // We wait until React has actually rendered meaningful content (not just an empty wrapper)
    // before fading out the splash screen. This prevents any white/blank flash.
    const root = document.getElementById('root');
    const splashLoader = document.getElementById('splash-loader');

    if (root && splashLoader) {
      function hideSplash() {
        splashLoader.style.opacity = '0';
        setTimeout(function() {
          splashLoader.style.display = 'none';
        }, 500);
      }

      // Check if the app has rendered real content (deep child nodes = actual UI)
      function hasRenderedContent() {
        // React Native Web renders nested divs; a real render has depth > 2
        return root.querySelector('[data-testid], [style]') !== null
          || root.querySelectorAll('div').length > 3;
      }

      const observer = new MutationObserver(function() {
        if (hasRenderedContent()) {
          // Small delay to ensure React has painted to screen
          requestAnimationFrame(function() {
            requestAnimationFrame(function() {
              hideSplash();
              observer.disconnect();
            });
          });
        }
      });
      observer.observe(root, { childList: true, subtree: true });

      // Safety fallback: hide splash after 8 seconds no matter what
      setTimeout(function() {
        if (splashLoader.style.display !== 'none') {
          hideSplash();
          observer.disconnect();
        }
      }, 8000);
    }
  </script>
</body>

</html>
